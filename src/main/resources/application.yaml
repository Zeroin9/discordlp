spring:
  application:
    name: discordlp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/discordlp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN}

pari:
  # Через сколько часов открытое пари автоматически отменяется с возвратом ставок (0 — без тайм-аута)
  timeout-hours: ${PARI_TIMEOUT_HOURS:24}
  # Доля комиссии организатора, удерживаемая из общего пула (0.05 — 5%, 0 — без комиссии)
  commission-rate: ${PARI_COMMISSION_RATE:0.05}

weekly-summary:
  # Канал, куда публикуется еженедельная сводка активности. Пусто — автопубликация выключена
  channel-id: ${WEEKLY_SUMMARY_CHANNEL_ID:}
  # Когда публиковать сводку (cron Spring: сек мин час день месяц день-недели); «-» отключает планировщик
  cron: ${WEEKLY_SUMMARY_CRON:0 0 12 * * MON}
  # Часовой пояс расписания и дат в заголовке сводки
  zone: ${WEEKLY_SUMMARY_ZONE:Europe/Moscow}
  # За сколько последних дней считается сводка
  days: ${WEEKLY_SUMMARY_DAYS:7}

logging:
  level:
    root: INFO
